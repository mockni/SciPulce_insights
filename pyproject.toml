[project]
name = "scipulse"
version = "1.0.0"
description = "SciPulse & SciPulse Insights — veille scientifique Medallion (MinIO, Great Expectations, Spark, Elastic Stack, Airflow)"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = []
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
]
