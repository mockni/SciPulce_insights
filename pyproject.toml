[project]
name = "scipulse"
version = "1.0.0"
description = "SciPulse — veille scientifique ArXiv × Hacker News (ElasticStack, Airflow, dbt, Great Expectations)"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests nécessitant la stack Docker (Elasticsearch) — pytest -m integration",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:great_expectations.*",
]
