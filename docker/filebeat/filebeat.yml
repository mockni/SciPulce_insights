# =============================================================================
#  Filebeat — collecte des logs du pipeline SciPulse (TP 8, partie C)
#  Sources :
#    - logs des tâches Airflow   : ./airflow/logs   (monté sur /var/log/airflow)
#    - logs des scripts locaux    : ./logs           (monté sur /var/log/scipulse)
#  Destination : index pipeline-logs-filebeat-AAAA.MM.JJ
# =============================================================================

filebeat.inputs:
  - type: filestream
    id: airflow-task-logs
    paths:
      - /var/log/airflow/dag_id=*/run_id=*/task_id=*/*.log
    fields_under_root: true
    fields:
      source_system: airflow
    processors:
      # dag_id / run_id / task_id / attempt à partir du chemin du fichier
      - dissect:
          tokenizer: "/var/log/airflow/dag_id=%{dag_id}/run_id=%{run_id}/task_id=%{task_id}/attempt=%{attempt}.log"
          field: "log.file.path"
          target_prefix: "airflow"
          ignore_failure: true
      # Ligne Airflow : "[2024-01-15T14:30:00.000+0000] {subprocess.py:93} INFO - message"
      - dissect:
          tokenizer: "[%{ts}] {%{source}} %{level} - %{msg}"
          field: "message"
          target_prefix: "airflow_line"
          ignore_failure: true
      - if:
          contains:
            message: "Marking task as SUCCESS"
        then:
          - add_fields:
              target: airflow
              fields:
                task_state: success
      - if:
          contains:
            message: "Marking task as FAILED"
        then:
          - add_fields:
              target: airflow
              fields:
                task_state: failed
      - if:
          contains:
            message: "Marking task as UP_FOR_RETRY"
        then:
          - add_fields:
              target: airflow
              fields:
                task_state: up_for_retry

  - type: filestream
    id: scipulse-script-logs
    paths:
      - /var/log/scipulse/*.log            # scripts lancés depuis l'hôte (./logs)
      - /var/log/airflow/scipulse/*.log    # scripts lancés par Airflow
    fields_under_root: true
    fields:
      source_system: scipulse-scripts

processors:
  - drop_fields:
      fields: ["agent.ephemeral_id", "ecs", "input"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "pipeline-logs-filebeat-%{+yyyy.MM.dd}"

# Index personnalisé → il faut déclarer le template et désactiver ILM / data streams
setup.ilm.enabled: false
setup.template.name: "pipeline-logs-filebeat"
setup.template.pattern: "pipeline-logs-filebeat-*"
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0

logging.level: info
