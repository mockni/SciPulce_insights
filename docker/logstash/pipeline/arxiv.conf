# =============================================================================
#  Pipeline Logstash — Ingestion ArXiv (batch)
#  Lit les fichiers JSON lines depuis /data/arxiv-raw/ et les indexe dans ES
#  Index de sortie : arxiv-papers-raw (mapping dynamique, version brute)
#
#  Le script src/ingestion/arxiv_bulk_ingest.py produit EXACTEMENT les mêmes
#  documents (index arxiv-papers-raw-py) pour comparer les deux approches.
# =============================================================================

input {
  file {
    path => "/data/arxiv-raw/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"          # relecture complète à chaque redémarrage (dev)
    codec => "json"                      # une ligne = un article JSON
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/dev/null"
  }
}

filter {

  # --- Renommage des champs pour un naming propre -------------------------
  mutate {
    rename => {
      "id"          => "arxiv_id"
      "update_date" => "date_updated"
    }
    # Métadonnées ajoutées par Logstash, sans valeur métier
    remove_field => ["@version", "@timestamp", "host", "path", "log", "event"]
  }

  # --- Parsing de la date de mise à jour (format "2023-02-07") ------------
  date {
    match  => ["date_updated", "yyyy-MM-dd"]
    target => "date_updated"
  }

  # --- Date de première publication = date de la version v1 ----------------
  # versions[0].created vaut par ex. "Mon, 2 Apr 2007 19:18:42 GMT"
  date {
    match          => ["[versions][0][created]", "EEE, d MMM yyyy HH:mm:ss z", "EEE, dd MMM yyyy HH:mm:ss z"]
    locale         => "en"
    target         => "date_published"
    tag_on_failure => ["_date_published_failure"]
  }
  if ![date_published] {
    mutate { copy => { "date_updated" => "date_published" } }
  }

  # --- Éclatement des catégories en tableau --------------------------------
  # Le champ `categories` arrive sous forme "cs.AI cs.LG stat.ML"
  mutate {
    split => { "categories" => " " }
  }

  # --- Extraction de la catégorie primaire --------------------------------
  ruby {
    code => '
      cats = event.get("categories")
      cats = [cats] if cats.is_a?(String)
      if cats.is_a?(Array) && cats.length > 0
        event.set("categories", cats)
        event.set("primary_category", cats[0])
      end
    '
  }

  # --- Nettoyage du texte -------------------------------------------------
  mutate {
    gsub  => [
      "abstract", "\n", " ",
      "title",    "\s+", " "
    ]
  }
  mutate {
    strip => ["abstract", "title"]
  }
}

output {
  elasticsearch {
    hosts       => ["http://elasticsearch:9200"]
    index       => "arxiv-papers-raw"
    document_id => "%{arxiv_id}"     # idempotence : réindexer écrase au lieu de dupliquer
    action      => "index"
  }

  # Décommenter pour le debug
  # stdout { codec => dots }
}
