# =============================================================================
#  Pipeline Logstash — logs des tâches Airflow → Elasticsearch (observabilité)
#
#  Logstash ne touche à AUCUNE donnée métier : les données passent par MinIO
#  (Bronze → Silver) puis Spark (Gold). Il collecte les journaux d'exécution du
#  pipeline pour le dashboard de monitoring.
#
#  Source : ./airflow/logs (monté sur /airflow-logs)
#    /airflow-logs/dag_id=<dag>/run_id=<run>/task_id=<task>/attempt=<n>.log
#  Ligne : [2026-10-16T14:30:00.123+0000] {subprocess.py:93} INFO - message
#  Sortie : index pipeline-logs-airflow-AAAA.MM.JJ
#           (gabarit créé par `python -m src.utils.mappings` : chaînes en keyword)
# =============================================================================

input {
  file {
    path => "/airflow-logs/dag_id=*/run_id=*/task_id=*/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-airflow"
    mode => "tail"
  }
}

filter {
  # Contexte Airflow tiré du chemin du fichier
  dissect {
    mapping => { "[log][file][path]" => "/airflow-logs/dag_id=%{dag_id}/run_id=%{run_id}/task_id=%{task_id}/attempt=%{attempt}.log" }
    tag_on_failure => ["_path_not_airflow"]
  }

  # Structure d'une ligne de log Airflow
  grok {
    match => { "message" => "^\[%{TIMESTAMP_ISO8601:log_ts}\] \{%{DATA:logger}\} %{LOGLEVEL:level} - %{GREEDYDATA:log_message}" }
    tag_on_failure => ["_unstructured_line"]
  }
  date {
    match  => ["log_ts", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "ISO8601"]
    target => "@timestamp"
  }

  # Changements d'état d'une tâche
  if [log_message] =~ /Marking task as / {
    grok { match => { "log_message" => "Marking task as %{WORD:task_state}" } }
    mutate { lowercase => ["task_state"] }
  }

  mutate {
    add_field    => { "log_type" => "airflow_log" }
    remove_field => ["event", "host", "@version", "log_ts"]
  }
}

output {
  elasticsearch {
    hosts           => ["http://elasticsearch:9200"]
    index           => "pipeline-logs-airflow-%{+YYYY.MM.dd}"
    data_stream     => false
    ilm_enabled     => false
    manage_template => false     # gabarit d'index géré par src/utils/mappings.py
  }
}
