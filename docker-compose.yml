###############################################################################
#  SciPulse & SciPulse Insights — docker-compose.yml
#  Stack : Elasticsearch · Logstash · Kibana · Airflow · PostgreSQL · MinIO · Spark
#
#  Démarrage de zéro :   make up        (= docker compose up -d --build)
#  Prérequis : Docker Desktop ≥ 4.x, 12 à 16 Go de RAM alloués au daemon
#
#  Architecture Medallion :
#    🥉 Bronze  MinIO  arxiv-raw/ hn-raw/ citations-raw/        (JSON Lines bruts)
#    🥈 Silver  MinIO  arxiv-clean/ hn-clean/ citations-clean/  (Parquet validé)
#    🥇 Gold    Elasticsearch  arxiv-papers-enriched (Spark)    → Kibana
###############################################################################

x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  image: scipulse-airflow:2.9.3
  # Linux : AIRFLOW_UID=$(id -u) dans .env → les fichiers écrits vous appartiennent
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    # Variables lues par le code SciPulse (src/config.py) : noms de services Docker
    ES_HOST: http://elasticsearch:9200
    KIBANA_HOST: http://kibana:5601
    PG_HOST: postgres
    PG_PORT: '5432'
    PG_USER: scipulse
    PG_PASSWORD: scipulse
    PG_DATABASE: scipulse
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    SPARK_MASTER: spark://spark-master:7077
    LAKE_URI: s3a://
    DATA_DIR: /opt/airflow/data
    ARXIV_SOURCE_FILE: ${ARXIV_SOURCE_FILE:-/opt/airflow/data/arxiv-cs-subset-100k.json}
    KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
    KAGGLE_KEY: ${KAGGLE_KEY:-}
    OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
    SCIPULSE_LOG_DIR: /opt/airflow/logs/scipulse
    PYTHONPATH: /opt/airflow
    PYTHONDONTWRITEBYTECODE: '1'
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./dbt:/opt/airflow/dbt
    - ./gx:/opt/airflow/gx
  depends_on:
    postgres:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
  networks:
    - scipulse

x-spark-common: &spark-common
  build:
    context: ./docker/spark
  image: scipulse-spark:3.5.3
  environment:
    SPARK_NO_DAEMONIZE: 'true'
  networks:
    - scipulse

services:

  # ═══════════════════════════════════════════════════════════════════════════
  #  ELASTICSEARCH — couche Gold (serving) + observabilité
  # ═══════════════════════════════════════════════════════════════════════════
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: scipulse-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.name=scipulse-cluster
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - scipulse

  # ═══════════════════════════════════════════════════════════════════════════
  #  LOGSTASH — collecte des logs Airflow (observabilité, hors données métier)
  # ═══════════════════════════════════════════════════════════════════════════
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: scipulse-logstash
    volumes:
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./docker/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./airflow/logs:/airflow-logs:ro
      - logstash-data:/usr/share/logstash/data
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx512m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - scipulse

  # ═══════════════════════════════════════════════════════════════════════════
  #  KIBANA — dashboards (n'interroge que la couche Gold + pipeline-logs)
  # ═══════════════════════════════════════════════════════════════════════════
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: scipulse-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=scipulse-dev-only-encryption-key-32chars-min
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - scipulse

  # ═══════════════════════════════════════════════════════════════════════════
  #  POSTGRESQL — métastore Airflow + entrepôt dbt
  # ═══════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: scipulse-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - scipulse

  # ═══════════════════════════════════════════════════════════════════════════
  #  MINIO — data lake Medallion (Bronze / Silver)
  # ═══════════════════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: scipulse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio-data:/data
    networks:
      - scipulse

  # Création des six buckets Medallion au démarrage (attend que MinIO réponde)
  minio-init:
    image: minio/mc:latest
    container_name: scipulse-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done &&
        for b in arxiv-raw hn-raw citations-raw arxiv-clean hn-clean citations-clean; do
          mc mb --ignore-existing local/$$b;
        done &&
        echo '✅ Buckets Medallion créés'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    networks:
      - scipulse

  # ═══════════════════════════════════════════════════════════════════════════
  #  SPARK — cluster standalone (Module 2 : SciPulse Insights)
  #  Le driver tourne dans le conteneur Airflow (spark-submit en mode client).
  # ═══════════════════════════════════════════════════════════════════════════
  spark-master:
    <<: *spark-common
    container_name: scipulse-spark-master
    command: ["spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8090:8080"   # interface web du master
      - "7077:7077"

  spark-worker:
    <<: *spark-common
    container_name: scipulse-spark-worker
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "2", "--memory", "2g", "spark://spark-master:7077"]
    depends_on:
      - spark-master

  # ═══════════════════════════════════════════════════════════════════════════
  #  AIRFLOW — orchestration Bronze → Silver → Gold
  # ═══════════════════════════════════════════════════════════════════════════
  airflow-init:
    <<: *airflow-common
    container_name: scipulse-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs/scipulse
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER:-admin}" \
          --firstname Admin --lastname SciPulse --role Admin \
          --email admin@scipulse.local \
          --password "$${AIRFLOW_ADMIN_PASSWORD:-admin}" || true
        echo "✅ Airflow initialisé"
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: scipulse-airflow-web
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: scipulse-airflow-sched
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  es-data:
  pg-data:
  minio-data:
  logstash-data:

networks:
  scipulse:
    name: scipulse
    driver: bridge
